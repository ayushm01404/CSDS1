<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEasy</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#f2f3f5;
    }

 
    header{
      background:#1a73e8;
      padding:12px 40px;
      color:#fff;
    }

    .navbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    .search-box{
      width:45%;
    }

    .search-box input{
      width:100%;
      padding:8px;
      border:none;
      border-radius:4px;
    }

    .nav-links a{
      color:white;
      margin-left:20px;
      text-decoration:none;
      font-size:14px;
    }

    .categories{
      background:#fff;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
    }

    .categories div{
      font-size:14px;
      cursor:pointer;
    }


    .banner{
      margin:20px 40px;
      background:#dbe9ff;
      height:200px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      font-weight:bold;
      color:#1a73e8;
      border-radius:6px;
    }

    
    .product-section{
      margin:20px 40px;
    }

    .product-section h2{
      margin-bottom:15px;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .product-card{
      background:#fff;
      padding:15px;
      border-radius:6px;
      text-align:center;
    }

    .product-card img{
      width:100%;
      height:150px;
      object-fit:cover;
      margin-bottom:10px;
    }

    .product-card h4{
      font-size:16px;
      margin-bottom:5px;
    }

    .product-card p{
      font-size:14px;
      color:green;
      margin-bottom:10px;
    }

    .product-card button{
      padding:8px 12px;
      border:none;
      background:#1a73e8;
      color:#fff;
      border-radius:4px;
      cursor:pointer;
    }

    
    footer{
      background:#172337;
      color:#fff;
      padding:30px 40px;
      margin-top:40px;
      display:flex;
      justify-content:space-between;
    }

    footer div{
      font-size:14px;
    }

    @media(max-width:900px){
      .product-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .search-box{
        width:60%;
      }
    }

    @media(max-width:600px){
      .product-grid{
        grid-template-columns:1fr;
      }

      .categories{
        flex-wrap:wrap;
        gap:10px;
      }
    }
  </style>
</head>
<body>


  <header>
    <div class="navbar">
      <div class="logo">ShopEasy</div>
      <div class="search-box">
        <input type="text" placeholder="Search for products" />
      </div>
      <div class="nav-links">
        <a href="#">Login</a>
        <a href="#">Cart</a>
      </div>
    </div>
  </header>


  <section class="categories">
    <div>Mobiles</div>
    <div>Fashion</div>
    <div>Electronics</div>
    <div>Home</div>
    <div>Books</div>
    <div>Grocery</div>
  </section>

  
  <section class="banner">
    Big Deals | Simple UI
  </section>

  
  <section class="product-section">
    <h2>Featured Products</h2>
    <div class="product-grid">

      <div class="product-card">
        <img src="https://tse4.mm.bing.net/th/id/OIP.VOSEZ7ucOzX-yqRDhfYCmgHaEK?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="product" />
        <h4>Smartphone</h4>
        <p>₹12,999</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://tse3.mm.bing.net/th/id/OIP.-NU28GGIQ1V6cDX-k3OyBQHaE8?cb=ucfimg2&ucfimg=1&w=800&h=534&rs=1&pid=ImgDetMain&o=7&rm=3" alt="product" />
        <h4>Headphones</h4>
        <p>₹1,999</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://images.puma.com/image/upload/f_auto,q_auto,b_rgb:fafafa,w_750,h_750/global/192259/02/sv01/fnd/IND/fmt/png/Hybrid-NX-Men's-Running-Shoes" alt="product" />
        <h4>Running Shoes</h4>
        <p>₹2,499</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://tse2.mm.bing.net/th/id/OIP.C1n8qaPK4OVLEFYtMtcqRwHaJ4?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="product" />
        <h4>Backpack</h4>
        <p>₹999</p>
        <button>Add to Cart</button>
      </div>

    </div>
  </section>

  
  <footer>
    <div>About Us</div>
    <div>Help</div>
    <div>Privacy Policy</div>
    <div>Contact</div>
  </footer>

</body>
</html>
